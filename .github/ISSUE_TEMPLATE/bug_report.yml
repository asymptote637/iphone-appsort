name: Bug report
description: Report a reproducible AppSort problem without sharing private device data.
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Describe the exact step and result. Redact phone identifiers and private app data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS version, Python version, iPhone model and iOS version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include whether this happens in the synthetic demo or on a real phone.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Private data
      options:
        - label: I have not attached pairing records, raw usage, tokens, phone identifiers or private state.
          required: true
